services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ridesa
    ports:
      - "5432:5432"
    volumes:
      - ridesa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ridesa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ridesa_pg_data:
